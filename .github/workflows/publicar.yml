name: Publicar VORTEX
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comprobar version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "La etiqueta no coincide con package.json: v$version"
          }
          Write-Host "Publicando VORTEX v$version"
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar pruebas
        run: npm test
      - name: Preparar etiqueta de publicacion
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          git fetch --tags
          $existing = git rev-parse --verify "refs/tags/$tag" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $head = git rev-parse HEAD
            if ($existing.Trim() -ne $head.Trim()) {
              throw "La etiqueta $tag ya apunta a otra revision. Incrementa la version."
            }
            Write-Host "La etiqueta $tag ya existe"
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$tag"
            git push origin "$tag"
            if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar la etiqueta $tag" }
          }
      - name: Publicar instalador y archivos de actualizacion
        run: npm run publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
